[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "durable-webhooks"
version = "0.1.0"
description = "A dependency-free Python webhook outbox with leases and signed delivery."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
durable-webhooks = "relay.__main__:main"

[tool.setuptools.packages.find]
include = ["relay*"]
